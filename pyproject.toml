
[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-decision-service"
version = "0.1.0"
description = "Cost-sensitive machine failure classification with reproducible evaluation and a tested prediction API."
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.3.3,<4",
    "scikit-learn>=1.8,<2",
    "fastapi>=0.118.3,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.30,<1",
    "PyYAML>=6.0,<7",
    "joblib>=1.5,<2",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
