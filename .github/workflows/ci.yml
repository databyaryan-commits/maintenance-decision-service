
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: requirements-py314.txt

      - name: Install recorded dependencies
        run: |
          python -m pip install -r requirements-py314.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Download and verify dataset
        run: python -m maintain.download_data

      - name: Recreate dataset splits
        run: python -m maintain.splits

      - name: Reproduce trained models
        run: python -m maintain.train

      - name: Diagnose model reproducibility
        run: |
          python - <<'PY'
          import io
          import platform
          import subprocess
          from hashlib import sha256
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import yaml

          config = yaml.safe_load(
              Path("configs/decision.yaml").read_text(encoding="utf-8")
          )

          model_path = Path("models/random_forest.joblib")
          expected_hash = config["model"]["sha256"]
          actual_hash = sha256(model_path.read_bytes()).hexdigest()

          print("\nMODEL CHECKSUM COMPARISON")
          print("-" * 55)
          print(f"Operating system: {platform.system()}")
          print(f"Expected SHA-256: {expected_hash}")
          print(f"Actual SHA-256:   {actual_hash}")
          print(f"Exact match: {actual_hash == expected_hash}")

          reference_bytes = subprocess.check_output(
              [
                  "git",
                  "show",
                  "HEAD:artifacts/example/validation_predictions.csv",
              ]
          )

          reference = pd.read_csv(io.BytesIO(reference_bytes))
          reproduced = pd.read_csv(
              "artifacts/example/validation_predictions.csv"
          )

          print("\nVALIDATION PREDICTION COMPARISON")
          print("-" * 55)
          print(f"Reference rows: {len(reference)}")
          print(f"Reproduced rows: {len(reproduced)}")

          same_ids = reference["UDI"].equals(reproduced["UDI"])
          same_labels = reference["actual"].equals(reproduced["actual"])

          print(f"Same observation IDs: {same_ids}")
          print(f"Same true labels: {same_labels}")

          if same_ids and same_labels:
              original_scores = reference[
                  "random_forest_score"
              ].to_numpy()

              linux_scores = reproduced[
                  "random_forest_score"
              ].to_numpy()

              differences = np.abs(
                  original_scores - linux_scores
              )

              print(
                  "Maximum score difference:",
                  f"{differences.max():.16f}",
              )
              print(
                  "Exactly equal scores:",
                  np.array_equal(original_scores, linux_scores),
              )
              print(
                  "Scores equal within 1e-12:",
                  np.allclose(
                      original_scores,
                      linux_scores,
                      rtol=0,
                      atol=1e-12,
                  ),
              )
          else:
              print("Cannot compare scores: observation alignment differs.")

          print("\nDiagnostic completed.")
          PY

      - name: Compare frozen policy decisions
        run: |
          python - <<'PY'
          import io
          import subprocess
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import yaml
          from sklearn.metrics import average_precision_score

          config = yaml.safe_load(
              Path("configs/decision.yaml").read_text(encoding="utf-8")
          )

          threshold = float(config["decision"]["threshold"])
          fp_cost = int(config["decision"]["false_positive_penalty"])
          fn_cost = int(config["decision"]["false_negative_penalty"])

          reference_bytes = subprocess.check_output(
              [
                  "git",
                  "show",
                  "HEAD:artifacts/example/validation_predictions.csv",
              ]
          )

          original = pd.read_csv(io.BytesIO(reference_bytes))
          linux = pd.read_csv(
              "artifacts/example/validation_predictions.csv"
          )

          if (
              not original["UDI"].equals(linux["UDI"])
              or not original["actual"].equals(linux["actual"])
          ):
              raise ValueError("Validation records do not align.")

          actual = original["actual"].to_numpy(dtype=int)
          original_scores = original[
              "random_forest_score"
          ].to_numpy(dtype=float)
          linux_scores = linux[
              "random_forest_score"
          ].to_numpy(dtype=float)

          if not (
              np.isfinite(original_scores).all()
              and np.isfinite(linux_scores).all()
          ):
              raise ValueError("Invalid prediction scores.")

          original_reviews = original_scores >= threshold
          linux_reviews = linux_scores >= threshold

          changed = original_reviews != linux_reviews

          print("\nFROZEN DECISION COMPARISON")
          print("-" * 55)
          print(f"Frozen threshold: {threshold:.16f}")
          print(f"Changed decisions: {int(changed.sum())}")
          print(
              "Changed observation IDs:",
              original.loc[changed, "UDI"].tolist(),
          )

          def report(name, scores, reviews):
              tp = int(((actual == 1) & reviews).sum())
              fp = int(((actual == 0) & reviews).sum())
              fn = int(((actual == 1) & ~reviews).sum())
              tn = int(((actual == 0) & ~reviews).sum())

              penalty = fp * fp_cost + fn * fn_cost
              ap = average_precision_score(actual, scores)

              precision = tp / (tp + fp) if tp + fp else 0.0
              recall = tp / (tp + fn) if tp + fn else 0.0

              print(f"\n{name}")
              print(f"Average precision: {ap:.6f}")
              print(f"Precision: {precision:.4%}")
              print(f"Recall: {recall:.4%}")
              print(f"True positives: {tp}")
              print(f"False positives: {fp}")
              print(f"False negatives: {fn}")
              print(f"True negatives: {tn}")
              print(f"Penalty units: {penalty}")

          report("Original macOS reference", original_scores, original_reviews)
          report("Linux reproduction", linux_scores, linux_reviews)

          print("\nDecision comparison completed.")
          print("Frozen model configuration remains unchanged.")
          PY

      - name: Verify frozen model
        run: python -m maintain.frozen

      - name: Run automated tests
        run: python -m pytest -q

      - name: Check API and model prediction parity
        run: python -m maintain.check_parity
